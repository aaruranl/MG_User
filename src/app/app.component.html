<app-mobile-top-bar *ngIf="!isLoading && isLogin && currentUserType === userType.MEMBER && currentMember && currentMember.memberApproval === 2"></app-mobile-top-bar>
<app-navigation-bar *ngIf="!isLoading && isLogin && currentUserType === userType.MEMBER && mainUser && mainUser.isActiveSubscription && memberList.length > 0 && currentMember && currentMember.memberApproval === 2 && !isMobile" [hideProps]="hideNavProps"></app-navigation-bar>

<router-outlet class="main-content"></router-outlet>

<!-- Member Profile View Modal (Angular state-driven, opens when filterMemberViewData is set) -->
<div class="modal" *ngIf="filterMemberViewData" (click)="filterMemberViewData = null">
  <div class="modal-dialog modal-xl modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 rounded-2xl overflow-hidden shadow-2xl">
      <div class="modal-body p-0">
        <app-member-profile-modal
          [memberProfile]="filterMemberViewData"
          (closeModal)="filterMemberViewData = null"
        ></app-member-profile-modal>
      </div>
    </div>
  </div>
</div>

<app-loading *ngIf="isLoading"></app-loading>

<div *ngIf="!cookieConsent" class="cookie-banner">
  <div class="w-11/12 px-6 md:w-2/3 lg:w-1/2 mx-auto glass-panel p-6 rounded-2xl shadow-xl border border-amber-200/30">
    <p class="text-white/80 mb-4 text-xs leading-relaxed">
      Marriagegate uses <a href="/privacy-policy" class="text-amber-400 underline">cookies</a> and similar technologies to ensure optimal performance and security. We collect minimal location telemetry to format country codes accurately and safeguard your matrimonial experience.
    </p>
    <div class="flex gap-2">
      <button class="btn btn-gold px-6" (click)="accept()">Accept All</button>
      <button class="btn btn-light px-6" (click)="reject()">Reject</button>
    </div>
  </div>
</div>
