<app-mobile-top-bar *ngIf="!isLoading && isLogin && currentUserType === userType.MEMBER && currentMember && currentMember.memberApproval === 2"></app-mobile-top-bar>
<app-navigation-bar *ngIf="!isLoading && isLogin && currentUserType === userType.MEMBER && mainUser && mainUser.isActiveSubscription && memberList.length > 0 && currentMember && currentMember.memberApproval === 2 && !isMobile" [hideProps]="hideNavProps"></app-navigation-bar>

<router-outlet class="main-content"></router-outlet>

<div class="modal fade" id="staticBackdrops" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content border-0 rounded-2xl overflow-hidden shadow-md-xl">
      <div class="modal-body p-0">
        <app-member-profile-modal [memberProfile]="filterMemberViewData"></app-member-profile-modal>
      </div>
    </div>
  </div>
</div>
<app-loading *ngIf="isLoading"></app-loading>

<div *ngIf="!cookieConsent" class="cookie-banner">
  <div class="w-11/12 px-6 md:w-2/3 lg:w-1/2 mx-auto glass-panel p-6 rounded-2xl shadow-md-xl border border-warning-subtle">
    <p class="text-white-50 mb-6 small">
      Marriagegate uses <a href="/privacy-policy" class="text-amber-500 text-decoration-underline">cookies</a> and similar technologies to ensure optimal performance and security. We collect minimal location telemetry to format country codes accurately and safeguard your matrimonial experience.
    </p>
    <div class="flex gap-2">
      <button class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-cursor-pointer inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-cursor-pointer-sm inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-cursor-pointer-gold px-6" (click)="accept()">Accept All</button>
      <button class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-cursor-pointer inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-cursor-pointer-sm inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-cursor-pointer-outline-light px-6" (click)="reject()">Reject</button>
    </div>
  </div>
</div>
