<div class="block sm:hidden bg-white/95 backdrop-blur-md border-b border-amber-200/40 px-4 py-3 sticky top-0 z-40 shadow-xs">
  <div class="flex items-center justify-between">
    <!-- Logo -->
    <div [routerLink]="'/home/member'" class="cursor-pointer">
      <img
        src="https://dev1mg.blob.core.windows.net/mgate/logo/Logo.png"
        alt="logo"
        class="h-8 w-auto object-contain"
      />
    </div>

    <!-- Active User & Dropdowns -->
    <div class="flex items-center gap-2" *ngIf="selectedMember">
      <!-- Member Pill -->
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200/50">
        <img
          [src]="selectedMember.profileImages[0]?.url"
          class="w-6 h-6 rounded-full object-cover border border-amber-300"
          alt="avatar"
        />
        <span class="text-xs font-bold text-gray-800">{{ selectedMember.firstName }}</span>
      </div>

      <!-- Friend Request Bell -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleDropdown('friend', $event)"
          class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 text-xs"
        >
          <i class="fas fa-user-plus"></i>
          <span *ngIf="totalRequestList > 0" class="absolute -top-1 -right-1 w-4 h-4 bg-red-600 text-white rounded-full text-[9px] font-bold flex items-center justify-center">
            {{ totalRequestList }}
          </span>
        </button>

        <!-- Dropdown Box -->
        <div
          *ngIf="showFriendDropdown"
          (click)="$event.stopPropagation()"
          class="absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-amber-200/60 p-3 z-50 animate-in fade-in"
        >
          <div class="flex justify-between items-center pb-2 border-b border-gray-100 mb-2">
            <span class="text-xs font-bold text-gray-900">Requests</span>
            <span class="text-[10px] text-gray-400">{{ friendRequestList.length }}</span>
          </div>
          <div class="max-h-60 overflow-y-auto space-y-2">
            <div *ngFor="let r of friendRequestList" class="p-2 rounded-xl bg-gray-50 flex items-center gap-2 text-xs">
              <img [src]="r.profileImageURL" class="w-8 h-8 rounded-full object-cover" alt="" />
              <div class="flex-1 min-w-0">
                <p class="font-bold text-gray-800 truncate">{{ r.name }}</p>
                <div class="flex gap-1 mt-1" *ngIf="r.status === request.Pending">
                  <button (click)="confirmFriendRequest(r.id)" class="px-2 py-0.5 bg-[#5c142b] text-white rounded text-[10px]">Accept</button>
                  <button (click)="rejectFriendRequest(r.id)" class="px-2 py-0.5 bg-gray-200 text-gray-700 rounded text-[10px]">Reject</button>
                </div>
              </div>
            </div>
            <div *ngIf="friendRequestList.length === 0" class="text-center py-4 text-xs text-gray-400">
              No requests
            </div>
          </div>
        </div>
      </div>

      <!-- Notifications Bell -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleDropdown('notification', $event)"
          class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 text-xs"
        >
          <i class="fas fa-bell"></i>
          <span *ngIf="totalUnReadCount > 0" class="absolute -top-1 -right-1 w-4 h-4 bg-red-600 text-white rounded-full text-[9px] font-bold flex items-center justify-center">
            {{ totalUnReadCount }}
          </span>
        </button>

        <div
          *ngIf="showNotificationDropdown"
          (click)="$event.stopPropagation()"
          class="absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-amber-200/60 p-3 z-50"
        >
          <div class="flex justify-between items-center pb-2 border-b border-gray-100 mb-2">
            <span class="text-xs font-bold text-gray-900">Notifications</span>
          </div>
          <div class="max-h-60 overflow-y-auto space-y-2">
            <div *ngFor="let n of notificationList" (click)="navigateToNotificationSection(n)" class="p-2 rounded-xl bg-gray-50 text-xs cursor-pointer">
              <p class="font-bold text-gray-900">{{ n.title }}</p>
              <p class="text-gray-600 text-[11px] truncate">{{ n.body }}</p>
            </div>
            <div *ngIf="notificationList.length === 0" class="text-center py-4 text-xs text-gray-400">
              No notifications
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
