<div class="mb-6">
  <label *ngIf="isShowLabel" for="phonenumber" class="block text-sm font-semibold text-gray-700 mb-1.5"
    >Phone number <span class="text-red-600">*</span></label
  >
  <div class="">
    <div class="flex">
      <div class="pn">
        <ng-select
          [items]="phoneCodes"
          bindLabel="country"
          bindValue="code"
          [ngModelOptions]="{ standalone: true }"
          [clearable]="false"
          [searchable]="false"
          [(ngModel)]="selectedCode"
          (ngModelChange)="emitPhoneNumber()"
          [disabled]="readOnly"
        >
          <ng-template ng-header-tmp>
            <div class="search-max-w-7xl mx-auto px-6 sm:px-6 lg:px-8 p-2">
              <input
                type="text"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all search-input"
                placeholder="Search"
                (input)="onSearchChange($event)"
              />
            </div>
          </ng-template>
          <ng-template ng-label-tmp let-item="item">
            <div class="flex">
              <div>
                <img src="{{ item.flags?.svg }}" alt="" width="30px" />
              </div>
              <div>+{{ item.code }}</div>
            </div>
          </ng-template>
          <ng-template ng-option-tmp let-item="item" let-search="searchTerm">
            <div class="flex">
              <div>
                <img
                  src="{{ item.flags?.svg }}"
                  alt=""
                  width="30px"
                  class="mr-2"
                />
              </div>
              <div class="mr-4">+{{ item.code }}</div>
              <div class="">
                {{ item.country }}
              </div>
            </div>
          </ng-template>
        </ng-select>
      </div>
      <div class="w-full pi">
        <input
          type="number"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
          id="pn-number"
          [(ngModel)]="phoneNumber"
          placeholder=""
          (ngModelChange)="emitPhoneNumber()"
          [ngClass]="{ errorBorder: isSubmitted && !isValidPn }"
          autocomplete="disabled"
          [readOnly]="readOnly"
        />
      </div>
    </div>
    <div
      class="text-xs text-red-600 mt-1"
      *ngIf="isSubmitted && !isValidPn && !phoneNumber"
    >
      Phone number is required
    </div>
    <div
      class="text-xs text-red-600 mt-1"
      *ngIf="isSubmitted && phoneNumber && !isValidPn"
    >
      Invalid phone number
    </div>
  </div>
</div>
