<div class="w-full relative country-dropdown-container">
  
  <!-- Label (Optional) -->
  <label *ngIf="label" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1.5">
    {{ label }} <span *ngIf="required" class="text-red-600">*</span>
  </label>

  <!-- Trigger Box -->
  <div
    (click)="toggleDropdown()"
    [ngClass]="{
      'border-[#5c142b] ring-2 ring-[#5c142b]/20 bg-white': isOpen,
      'border-red-500 bg-red-50/20': error,
      'opacity-50 cursor-not-allowed bg-gray-100': disabled,
      'cursor-pointer bg-white hover:border-gray-400': !disabled
    }"
    class="min-h-[42px] px-3.5 py-2 rounded-xl border border-gray-300 transition-all flex items-center justify-between gap-2 shadow-xs"
  >
    <!-- Selected Content Area -->
    <div class="flex-1 flex flex-wrap items-center gap-1.5 min-w-0">
      
      <!-- Multi-select Pills -->
      <ng-container *ngIf="multiple && selectedValue?.length > 0">
        <span
          *ngFor="let item of selectedValue"
          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-50 border border-amber-200 text-xs font-semibold text-gray-800"
        >
          <span>{{ item?.country || item }}</span>
          <i
            (click)="removeSingleSelected(item, $event)"
            class="fas fa-times text-[10px] text-gray-400 hover:text-red-600 cursor-pointer"
          ></i>
        </span>
      </ng-container>

      <!-- Single Selected Item with Flag -->
      <ng-container *ngIf="!multiple && selectedValue">
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-900 truncate">
          <img
            *ngIf="getSelectedDisplayItem()?.flags?.svg"
            [src]="getSelectedDisplayItem()?.flags?.svg"
            alt="flag"
            class="w-4 h-3 object-cover rounded-xs border border-gray-200"
          />
          <span class="truncate">{{ getSelectedDisplayItem()?.country || selectedValue }}</span>
        </div>
      </ng-container>

      <!-- Placeholder -->
      <span
        *ngIf="(!selectedValue || (multiple && selectedValue.length === 0))"
        class="text-xs text-gray-400 select-none"
      >
        {{ placeholder }}
      </span>

    </div>

    <!-- Actions (Clear & Chevron) -->
    <div class="flex items-center gap-1.5 flex-shrink-0 text-gray-400">
      <i
        *ngIf="selectedValue && (multiple ? selectedValue.length > 0 : true)"
        (click)="clearAll($event)"
        class="fas fa-times text-xs hover:text-red-600 cursor-pointer p-0.5"
        title="Clear selection"
      ></i>
      <i
        class="fas fa-chevron-down text-xs transition-transform duration-200"
        [ngClass]="{ 'rotate-180 text-[#5c142b]': isOpen }"
      ></i>
    </div>
  </div>

  <!-- Searchable Dropdown Menu -->
  <div
    *ngIf="isOpen"
    class="absolute left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-amber-200/60 overflow-hidden z-50 animate-in fade-in duration-150"
  >
    <!-- Search Input Box -->
    <div class="p-2.5 bg-gray-50 border-b border-gray-100 relative">
      <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
      <input
        type="text"
        [(ngModel)]="searchText"
        (input)="onSearch(searchText)"
        placeholder="Search country name or code..."
        class="w-full pl-8 pr-3 py-1.5 rounded-xl border border-gray-200 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-xs bg-white transition-all placeholder:text-gray-400"
        autofocus
      />
    </div>

    <!-- Country Option List -->
    <div class="max-h-60 overflow-y-auto p-1.5 space-y-0.5 country-scroll-list">
      <div
        *ngFor="let country of filteredCountries"
        (click)="selectCountry(country)"
        [ngClass]="{
          'bg-amber-50/80 text-[#5c142b] font-bold': isSelected(country),
          'hover:bg-gray-50 text-gray-700': !isSelected(country)
        }"
        class="flex items-center justify-between px-3 py-2 rounded-xl cursor-pointer text-xs transition-all"
      >
        <div class="flex items-center gap-2.5 min-w-0">
          <img
            *ngIf="country.flags?.svg"
            [src]="country.flags?.svg"
            alt="flag"
            class="w-5 h-3.5 object-cover rounded-xs border border-gray-100 flex-shrink-0 shadow-2xs"
          />
          <span class="truncate">{{ country.country }}</span>
          <span class="text-[11px] text-gray-400 flex-shrink-0">(+{{ country.code }})</span>
        </div>

        <i *ngIf="isSelected(country)" class="fas fa-check text-xs text-[#5c142b] flex-shrink-0"></i>
      </div>

      <!-- Empty Search Results -->
      <div *ngIf="filteredCountries.length === 0" class="py-8 text-center text-gray-400 text-xs">
        <i class="fas fa-globe-americas text-2xl mb-1.5 text-gray-300"></i>
        <p>No matching countries found</p>
      </div>
    </div>
  </div>

</div>
