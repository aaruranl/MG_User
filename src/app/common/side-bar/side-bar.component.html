<div class="h-full flex flex-col p-5 bg-white rounded-3xl border border-amber-200/50 shadow-sm" *ngIf="!isLoading && !isInitialLoad">
  
  <!-- Header Filter Title & Actions -->
  <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-4">
    <div class="flex items-center gap-2 text-base font-bold text-gray-900">
      <i class="fas fa-sliders-h text-[#5c142b]"></i>
      <span>Refine Matches</span>
    </div>
    <button
      (click)="clearFilter()"
      class="text-xs font-semibold text-red-600 hover:text-red-700 hover:underline transition-all"
    >
      Clear All
    </button>
  </div>

  <!-- Search Input Box -->
  <div class="relative mb-5">
    <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
    <input
      type="text"
      class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-xs bg-gray-50/50 text-gray-800 transition-all placeholder:text-gray-400"
      [(ngModel)]="searchText"
      (keyup)="searchMembers(searchText)"
      placeholder="Search name, job, country..."
    />
  </div>

  <!-- Filter Sections (Accordion / Cards) -->
  <div class="flex-1 overflow-y-auto pr-1 space-y-4 text-xs">
    
    <!-- Origin Country Selection -->
    <div class="p-4 rounded-2xl bg-amber-50/30 border border-amber-200/40 space-y-2">
      <label class="block font-bold text-gray-800 uppercase tracking-wider text-[11px]">Origin Country</label>
      <ng-select
        [items]="countryList"
        bindLabel="country"
        bindValue="country"
        [ngModelOptions]="{standalone: true}"
        [clearable]="true"
        [searchable]="true"
        [multiple]="true"
        [(ngModel)]="selectedCountry"
        (change)="ngSelectChange()"
        placeholder="Select origin country"
      >
        <ng-template ng-label-tmp let-item="item">
          <div class="flex items-center gap-2">
            <img class="w-4 h-3 object-cover rounded-xs" [src]="item.flags?.svg" alt="" />
            <span>{{ item.country }}</span>
          </div>
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
          <div class="flex items-center gap-2 py-1">
            <img class="w-5 h-3.5 object-cover rounded-xs" [src]="item.flags?.svg" alt="" />
            <span>{{ item.country }}</span>
          </div>
        </ng-template>
      </ng-select>
    </div>

    <!-- Living Country Selection -->
    <div class="p-4 rounded-2xl bg-gray-50 border border-gray-100 space-y-2">
      <label class="block font-bold text-gray-800 uppercase tracking-wider text-[11px]">Living Country</label>
      <ng-select
        [items]="countryList"
        bindLabel="country"
        bindValue="country"
        [ngModelOptions]="{standalone: true}"
        [clearable]="true"
        [searchable]="true"
        [multiple]="true"
        [(ngModel)]="selectedLivingCountry"
        (change)="ngSelectChange()"
        placeholder="Select living country"
      >
        <ng-template ng-label-tmp let-item="item">
          <div class="flex items-center gap-2">
            <img class="w-4 h-3 object-cover rounded-xs" [src]="item.flags?.svg" alt="" />
            <span>{{ item.country }}</span>
          </div>
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
          <div class="flex items-center gap-2 py-1">
            <img class="w-5 h-3.5 object-cover rounded-xs" [src]="item.flags?.svg" alt="" />
            <span>{{ item.country }}</span>
          </div>
        </ng-template>
      </ng-select>
    </div>

    <!-- Religion Selection -->
    <div class="p-4 rounded-2xl bg-amber-50/30 border border-amber-200/40 space-y-2">
      <label class="block font-bold text-gray-800 uppercase tracking-wider text-[11px]">Religion</label>
      <ng-select
        [items]="religionList"
        bindLabel="name"
        bindValue="id"
        [ngModelOptions]="{standalone: true}"
        [clearable]="true"
        [searchable]="true"
        [multiple]="true"
        [(ngModel)]="selectedReligion"
        (change)="ngSelectChange()"
        placeholder="Select religions"
      ></ng-select>
    </div>

    <!-- Community Selection -->
    <div class="p-4 rounded-2xl bg-gray-50 border border-gray-100 space-y-2" *ngIf="communityList.length > 0">
      <label class="block font-bold text-gray-800 uppercase tracking-wider text-[11px]">Community / Cast</label>
      <ng-select
        [items]="communityList"
        bindLabel="name"
        bindValue="id"
        [ngModelOptions]="{standalone: true}"
        [clearable]="true"
        [searchable]="true"
        [multiple]="true"
        [(ngModel)]="selectedCommunity"
        (change)="ngSelectChange()"
        placeholder="Select community"
      ></ng-select>
    </div>

    <!-- Diet / Food Habits -->
    <div class="p-4 rounded-2xl bg-amber-50/30 border border-amber-200/40 space-y-2">
      <label class="block font-bold text-gray-800 uppercase tracking-wider text-[11px]">Dietary Habits</label>
      <div class="space-y-1.5 pt-1">
        <label *ngFor="let d of dietList" class="flex items-center gap-2 cursor-pointer">
          <input
            type="checkbox"
            [value]="d.id"
            (change)="onDietChange($event)"
            class="w-4 h-4 rounded text-[#5c142b] focus:ring-[#5c142b]/30 accent-[#5c142b]"
          />
          <span class="text-xs text-gray-700">{{ d.name }}</span>
        </label>
      </div>
    </div>

  </div>

</div>
