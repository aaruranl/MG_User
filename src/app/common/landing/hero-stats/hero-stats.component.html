<div class="mt-5 animate-fade-in delay-500 w-100">
  
  <!-- Call to Actions -->
  <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center align-items-center mt-2">
    <a [routerLink]="isBlog ? '/success-stories' : '/blogs'" 
       class="btn btn-outline-danger btn-lg px-4 py-3 rounded-pill fw-bold d-inline-flex align-items-center justify-content-center transition-all hover-scale"
       style="min-width: 220px; font-size: 1.1rem; border-width: 2px;">
      <i class="{{ isBlog ? 'fas fa-book-open' : 'fas fa-blog' }} me-2"></i> {{ isBlog ? 'Read Stories' : 'Read Blog' }}
    </a>
    
    <a [href]="baseUrl + 'login'" target="_blank"
       class="btn btn-danger btn-lg px-4 py-3 rounded-pill shadow fw-bold d-inline-flex align-items-center justify-content-center transition-all hover-scale"
       style="min-width: 220px; font-size: 1.1rem; background: linear-gradient(135deg, #ef2626 0%, #c34242 100%); border: none;">
      <i class="fas fa-heart me-2"></i> Find Your Match
    </a>
  </div>

</div>
