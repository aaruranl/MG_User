<app-top-bar
  *ngIf="
    memberProfile &&
    !isLoading &&
    memberProfile.memberApproval === 1 &&
    memberProfile &&
    memberIdInput === ''
  "
></app-top-bar>

<section class="min-h-screen py-6 sm:py-10 bg-gradient-to-b from-[#faf8f5] via-[#fcfbf9] to-[#f4eee6]">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Stepper Navigation Bar (Responsive Pill Carousel) -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-2 border border-gray-200/80 shadow-sm mb-6 sticky top-16 z-40">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 px-1">
        <button
          type="button"
          *ngFor="let step of stepList; let i = index"
          (click)="changeStep(step.key)"
          [ngClass]="{
            'bg-gradient-to-r from-[#5c142b] to-[#7e1e3b] text-white shadow-md shadow-[#5c142b]/20 font-bold': currentStep === step.key,
            'text-gray-600 hover:text-[#5c142b] hover:bg-amber-50/50': currentStep !== step.key
          }"
          class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs whitespace-nowrap transition-all flex-shrink-0 cursor-pointer"
        >
          <span
            [ngClass]="{
              'bg-white/20 text-amber-200': currentStep === step.key,
              'bg-gray-100 text-gray-500': currentStep !== step.key
            }"
            class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold"
          >
            {{ i + 1 }}
          </span>
          <span>{{ step.label }}</span>
        </button>
      </div>
    </div>

    <!-- Active Step Header Banner -->
    <div class="bg-gradient-to-r from-[#5c142b] via-[#7e1e3b] to-[#c99839] rounded-3xl p-6 sm:p-8 text-white shadow-xl mb-6 relative overflow-hidden">
      <!-- Ambient Glow Decor -->
      <div class="absolute -top-12 -right-12 w-44 h-44 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -left-10 w-44 h-44 rounded-full bg-amber-400/20 blur-2xl pointer-events-none"></div>

      <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/15 backdrop-blur-md border border-white/20 flex items-center justify-center flex-shrink-0 shadow-inner">
            <i class="fas fa-heart text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.lookingFor"></i>
            <i class="fas fa-user text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.basic"></i>
            <i class="fas fa-phone-alt text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.contact"></i>
            <i class="fas fa-heart-pulse text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.personal"></i>
            <i class="fas fa-users text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.family"></i>
            <i class="fas fa-om text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.religionBackground"></i>
            <i class="fas fa-graduation-cap text-xl sm:text-2xl text-amber-200" *ngIf="currentStep === steps.education"></i>
          </div>

          <div>
            <span class="inline-block px-2.5 py-0.5 rounded-full bg-white/20 text-[11px] font-bold tracking-wider uppercase mb-1">
              Editing Step {{ currentStep + 1 }} of 7
            </span>
            <h1 class="text-xl sm:text-2xl font-serif font-bold text-white">
              <span *ngIf="currentStep === steps.lookingFor">Matching Criteria</span>
              <span *ngIf="currentStep === steps.basic">Personal Information</span>
              <span *ngIf="currentStep === steps.contact">Contact Details</span>
              <span *ngIf="currentStep === steps.personal">Lifestyle & Habits</span>
              <span *ngIf="currentStep === steps.family">Family Background</span>
              <span *ngIf="currentStep === steps.religionBackground">Religious Background</span>
              <span *ngIf="currentStep === steps.education">Education & Career</span>
            </h1>
          </div>
        </div>

        <!-- Member info badge -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-white/10 border border-white/20 backdrop-blur-sm text-xs font-semibold" *ngIf="memberProfile">
          <img
            [src]="memberProfile.profileImages?.[0]?.url"
            class="w-6 h-6 rounded-full object-cover border border-amber-300"
            alt="profile"
          />
          <span>{{ memberProfile.firstName }} {{ memberProfile.lastName }}</span>
        </div>
      </div>
    </div>

    <!-- Edit Form Card Container -->
    <div class="bg-white rounded-3xl border border-amber-200/40 shadow-xl shadow-[#5c142b]/5 p-6 sm:p-10 relative overflow-hidden" *ngIf="!isLoading">
      
      <!-- Step 1: Matching / Looking For -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.lookingFor }">
        <app-looking-for-form
          [isEditFrom]="true"
          [memberProfile]="memberProfile"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-looking-for-form>
      </div>

      <!-- Step 2: Basic Info -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.basic }">
        <app-member-profile-form
          [memberProfile]="memberProfile"
          [isEditFrom]="true"
          [hideGender]="isHideGender"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-member-profile-form>
      </div>

      <!-- Step 3: Contact Info -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.contact }">
        <app-contact-info-form
          [isEditFrom]="true"
          [memberProfile]="memberProfile"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-contact-info-form>
      </div>

      <!-- Step 4: Personal Lifestyle -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.personal }">
        <app-personal-details-form
          [isEditFrom]="true"
          [memberProfile]="memberProfile"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-personal-details-form>
      </div>

      <!-- Step 5: Family Background -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.family }">
        <app-family-information-form
          [isEditFrom]="true"
          [memberProfile]="memberProfile"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-family-information-form>
      </div>

      <!-- Step 6: Religious Background -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.religionBackground }">
        <app-religious-background-form
          [isEditFrom]="true"
          [memberProfile]="memberProfile"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-religious-background-form>
      </div>

      <!-- Step 7: Education & Career -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.education }">
        <app-education-details-form
          [isEditFrom]="true"
          [memberProfile]="memberProfile"
          (refreshMemberProfileEmitter)="refreshMemberProfile()"
        ></app-education-details-form>
      </div>

    </div>

    <!-- Spinner Loading Overlay -->
    <app-loading *ngIf="isLoading"></app-loading>

  </div>
</section>
