<app-top-bar *ngIf="mainUser && mainUser.memberCount === 0"></app-top-bar>

<section class="min-h-screen py-8 sm:py-12 bg-gradient-to-b from-[#faf8f5] via-[#fcfbf9] to-[#f4eee6]">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Top Stepper Header Card -->
    <div class="bg-gradient-to-r from-[#5c142b] via-[#7e1e3b] to-[#c99839] rounded-3xl p-6 sm:p-8 text-white shadow-xl mb-8 relative overflow-hidden">
      <!-- Background subtle glow shapes -->
      <div class="absolute -top-12 -right-12 w-44 h-44 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -left-10 w-44 h-44 rounded-full bg-amber-400/20 blur-2xl pointer-events-none"></div>

      <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <!-- Step Icon Badge -->
          <div class="w-14 h-14 rounded-2xl bg-white/15 backdrop-blur-md border border-white/20 flex items-center justify-center flex-shrink-0 shadow-inner">
            <i class="fas fa-heart text-2xl text-amber-200" *ngIf="currentStep === steps.lookingFor"></i>
            <i class="fas fa-user text-2xl text-amber-200" *ngIf="currentStep === steps.basic"></i>
            <i class="fas fa-phone-alt text-2xl text-amber-200" *ngIf="currentStep === steps.contact"></i>
            <i class="fas fa-heart-pulse text-2xl text-amber-200" *ngIf="currentStep === steps.personal"></i>
            <i class="fas fa-users text-2xl text-amber-200" *ngIf="currentStep === steps.family"></i>
            <i class="fas fa-om text-2xl text-amber-200" *ngIf="currentStep === steps.religionBackground"></i>
            <i class="fas fa-graduation-cap text-2xl text-amber-200" *ngIf="currentStep === steps.education"></i>
          </div>

          <div>
            <span class="inline-block px-2.5 py-0.5 rounded-full bg-white/20 text-[11px] font-bold tracking-wider uppercase mb-1">
              Step {{ currentStep + 1 }} of 7
            </span>
            <h1 class="text-xl sm:text-2xl font-serif font-bold text-white">
              <span *ngIf="currentStep === steps.lookingFor">Matching Preferences</span>
              <span *ngIf="currentStep === steps.basic">Personal Details</span>
              <span *ngIf="currentStep === steps.contact">Contact & Location</span>
              <span *ngIf="currentStep === steps.personal">Lifestyle & Habits</span>
              <span *ngIf="currentStep === steps.family">Family Background</span>
              <span *ngIf="currentStep === steps.religionBackground">Religious Background</span>
              <span *ngIf="currentStep === steps.education">Education & Career</span>
            </h1>
          </div>
        </div>

        <!-- Back Button (if eligible) -->
        <button
          *ngIf="(mainUser && mainUser.memberCount > 0) || currentStep !== steps.lookingFor"
          (click)="goBack()"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-semibold text-white backdrop-blur-sm transition-all"
        >
          <i class="fas fa-arrow-left"></i>
          <span>Previous Step</span>
        </button>
      </div>

      <!-- Stepper Pill Indicators -->
      <div class="mt-6 pt-6 border-t border-white/15">
        <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
          <div
            *ngFor="let s of [0, 1, 2, 3, 4, 5, 6]; let i = index"
            class="h-1.5 rounded-full transition-all duration-300"
            [ngClass]="{
              'bg-amber-300 shadow-sm shadow-amber-300/50': i <= currentStep,
              'bg-white/20': i > currentStep
            }"
          ></div>
        </div>
      </div>
    </div>

    <!-- Form Container Card -->
    <div class="bg-white rounded-3xl border border-amber-200/40 shadow-xl shadow-[#5c142b]/5 p-6 sm:p-10 relative overflow-hidden">
      
      <!-- Step 1: Looking For / Matching -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.lookingFor }">
        <app-looking-for-form
          (userMatchingDetailsEmitter)="getUserLookingForDetails($event)"
        ></app-looking-for-form>
      </div>

      <!-- Step 2: Basic Profile -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.basic }">
        <app-member-profile-form
          (basicDetailsEmitter)="getUserBasicDetailsEmitter($event)"
          [hideGender]="isHideGender"
        ></app-member-profile-form>
      </div>

      <!-- Step 3: Contact Info -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.contact }">
        <app-contact-info-form
          (contactDetailsEmitter)="getUserContactDetailsEmitter($event)"
        ></app-contact-info-form>
      </div>

      <!-- Step 4: Personal Lifestyle -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.personal }">
        <app-personal-details-form
          (personalDetailsEmitter)="getUserPersonalDetailsEmitter($event)"
        ></app-personal-details-form>
      </div>

      <!-- Step 5: Family Information -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.family }">
        <app-family-information-form
          (userFamilyEmitter)="getUserFamilyDetailsEmitter($event)"
        ></app-family-information-form>
      </div>

      <!-- Step 6: Religious Background -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.religionBackground }">
        <app-religious-background-form
          (userReligiousEmitter)="getUserReligiousEmitter($event)"
        ></app-religious-background-form>
      </div>

      <!-- Step 7: Education & Career -->
      <div [ngClass]="{ 'hidden': currentStep !== steps.education }">
        <app-education-details-form
          (userEducationEmitter)="getEducationDetails($event)"
        ></app-education-details-form>
      </div>

      <!-- Spinner Overlay -->
      <app-loading *ngIf="isLoading"></app-loading>
    </div>

  </div>
</section>
