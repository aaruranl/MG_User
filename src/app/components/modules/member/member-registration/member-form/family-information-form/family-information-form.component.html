<form [formGroup]="userFamilyInfoForm">
  <div class="flex flex-wrap -mx-3">
    <div class="w-full px-6 md:w-1/2">
      <div class="form-group mb-6">
        <label for="fatherName" class="mb-1">Father's Name<span class="text-red-600">*</span> </label>
        <input type="text" id="fatherName" formControlName="fatherName" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userFamilyInfoForm.get('fatherName')?.errors}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userFamilyInfoForm.get('fatherName')?.errors">Father's name is required</div>
      </div>
    </div>

    <div class="w-full px-6 md:w-1/2">
      <div class="form-group mb-6">
        <label for="motherName" class="mb-1">Mother's Name<span class="text-red-600">*</span> </label>
        <input type="text" id="motherName" formControlName="motherName" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userFamilyInfoForm.get('motherName')?.errors}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userFamilyInfoForm.get('motherName')?.errors">Mother's name is required</div>
      </div>
    </div>

    <div class="w-full px-6 md:w-1/2">
      <div class="form-group mb-6">
        <label for="fatherOccupation" class="mb-1">Father's Occupation<span class="text-red-600">*</span> </label>
        <input type="text" id="fatherOccupation" formControlName="fatherOccupation" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userFamilyInfoForm.get('fatherOccupation')?.errors}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userFamilyInfoForm.get('fatherOccupation')?.errors">Father's occupation is required</div>
      </div>
    </div>

    <div class="w-full px-6 md:w-1/2">
      <div class="form-group mb-6">
        <label for="matherOccupation" class="mb-1">Mother's Occupation<span class="text-red-600">*</span> </label>
        <input type="text" id="matherOccupation" formControlName="matherOccupation" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userFamilyInfoForm.get('matherOccupation')?.errors}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userFamilyInfoForm.get('matherOccupation')?.errors">Mother's occupation is required</div>

      </div>
    </div>

    <div class="w-full px-6 md:w-1/2">
      <div class="form-group mb-6">
        <label for="siblings" class="mb-1">Number Of Siblings<span class="text-red-600">*</span> </label>
        <input type="number" id="siblings" formControlName="siblings" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userFamilyInfoForm.get('siblings')?.errors}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userFamilyInfoForm.get('siblings')?.errors?.['required']">Number of siblings is required</div>

      </div>
    </div>

    <div class="w-full px-6 md:w-1/2">
      <label for="matherOccupation" class="mb-1">Family Type<span class="text-red-600">*</span> </label>
      <ng-select  [ngClass]="{'errorSelect': isSubmitted && selectedFamily < 1}" [items]="familyTypeList" bindLabel="name" bindValue="id" [searchable]="false" [(ngModel)]="selectedFamily" [clearable]="false" formControlName="familyType"></ng-select>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <app-country-dropdown
        label="Origin Country"
        [required]="true"
        [(ngModel)]="selectedCountry"
        [ngModelOptions]="{standalone: true}"
        placeholder="Select origin country..."
      ></app-country-dropdown>
    </div>
    <button class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium text-white bg-red-600 hover:bg-red-700 shadow-sm transition-all mr-4 w-full mt-8" [disabled]="isLoading" (click)="next()">
      {{ isEditFrom ? 'UPDATE' : 'NEXT'}} <div class="spinner-border spinner-border-sm text-light mr-1" *ngIf="isLoading"></div></button>
  </div>
</form>
