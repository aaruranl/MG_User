<form [formGroup]="userContactFrom">
  <div class="flex flex-wrap -mx-3">
    <div class="font-bold text-gray-500 mb-6">Contact Information</div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="email text-sm" class="mb-2"
        >Email<span class="text-red-600">*</span>
      </label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder: isSubmitted && userContactFrom.get('email')?.errors
        }"
      />
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('email')?.errors?.['required']"
      >
        Email is required
      </div>
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('email')?.errors?.['email']"
      >
        Invalid email
      </div>
    </div>
    <div class="w-full px-6 md:w-1/2">
      <app-phone-number-input
        class="mb-0"
        (phoneNumberEmitter)="getPhoneNumber($event)"
        [isSubmitted]="isSubmitted"
        [setPhoneNumber]="setPhoneNumber"
        [phoneCode]="PhoneCode"
      ></app-phone-number-input>
      <div class="form-check mt-1">
        <input
          type="checkbox"
          id="phoneflexCheckChecked"
          formControlName="isVisiblePhoneNumber"
          class="form-check-input small-check"
          value="true"
        /><label
          for="phoneflexCheckChecked"
          class="form-check-label ml-2 text-sm"
        >
          Make it visible.
        </label>
      </div>
    </div>

    <!-- GOOGLE AUTO COMPLETE -->
    <div class="font-bold text-gray-500 mb-6">Living Address</div>
    <div class="w-full px-6 mb-6">
      <label for="Door text-sm" class="mb-2">Search Address</label>
      <input
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        #placesRef="ngx-places"
        ngx-gp-autocomplete
        (onAddressChange)="handleAddressChange($event)"
      />
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="email text-sm" class="mb-2"
        >Country<span class="text-red-600">*</span>
      </label>

      [items]="countryList"
      bindLabel="country"

      [clearable]="false"
      [searchable]="true"

          </div>
          <div>

          </div>

      </ng-template>
      <ng-template ng-option-tmp let-item="item" let-search="searchTerm">

          <div class="">

          </div>
        </div>
      </ng-template>
    </ng-select> -->
      <input
        type="text"
        id="province"
        formControlName="country"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder: isSubmitted && userContactFrom.get('country')?.errors
        }"
      />
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('country')?.errors"
      >
        Country is required
      </div>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="province text-sm" class="mb-2"
        >State/Province<span class="text-red-600">*</span>
      </label>

      <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userContactFrom.get('stateProvince')?.errors">State/Province is required</div> -->

      [searchable]="true" [(ngModel)]="selectedProvince"  [ngModelOptions]="{standalone: true}"></ng-select> -->
      <input
        type="text"
        id="stateProvince"
        formControlName="stateProvince"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder:
            isSubmitted && userContactFrom.get('stateProvince')?.errors
        }"
      />
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('stateProvince')?.errors"
      >
        Province is required
      </div>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="city text-sm" class="mb-2"
        >City/Village<span class="text-red-600">*</span>
      </label>
      <input
        type="text"
        id="city"
        formControlName="city"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder: isSubmitted && userContactFrom.get('city')?.errors
        }"
      />
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('city')?.errors"
      >
        City is required
      </div>
    </div>
    <!-- STREET -->
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="Street text-sm" class="mb-2"
        >Street<span class="text-red-600">*</span>
      </label>
      <input
        type="text"
        id="Street"
        formControlName="street"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder: isSubmitted && userContactFrom.get('street')?.errors
        }"
      />
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('street')?.errors"
      >
        Street is required
      </div>
    </div>
    <!-- DOOR NUMBER -->
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="Door text-sm" class="mb-2">Door No</label>
      <input
        type="text"
        id="Door"
        formControlName="doorNumber"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder: isSubmitted && userContactFrom.get('doorNumber')?.errors
        }"
      />
      <!-- <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userContactFrom.get('doorNumber')?.errors">City is required</div> -->
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="province text-sm" class="mb-2"
        >Zip/Postal Code<span class="text-red-600">*</span>
      </label>
      <input
        type="text"
        id="province"
        formControlName="zipCode"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"
        [ngClass]="{
          errorBorder: isSubmitted && userContactFrom.get('zipCode')?.errors
        }"
      />
      <div
        class="text-xs text-red-600 mt-1"
        *ngIf="isSubmitted && userContactFrom.get('zipCode')?.errors"
      >
        ZipCode is required
      </div>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="text-sm" class="mb-2"
        >Residency Status<span class="text-red-600">*</span>
      </label>
      <ng-select
        [items]="residencyStatusList"
        bindLabel="name"
        bindValue="id"
        [searchable]="true"
        [clearable]="false"
        formControlName="residencyStatus"
        [(ngModel)]="selectedResidency"
      ></ng-select>
    </div>

    <button
      class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium text-white bg-red-600 hover:bg-red-700 shadow-sm transition-all mr-4 w-full mt-8"
      (click)="next()"
      [disabled]="isLoading"
    >
      <div
        class="spinner-border spinner-border-sm text-light mr-1"
        *ngIf="isLoading"
      ></div>
      {{ isEditFrom ? "UPDATE" : "NEXT" }}
