<form [formGroup]="userReligiousForm">
  <div class="flex flex-wrap -mx-3">
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Religion
        <span class="text-red-600">*</span>
      </label>
      <ng-select
      [items]="religionList"
      bindLabel="name"
      bindValue="id"
      [ngModelOptions]="{standalone: true}"
      [clearable]="false"
      [searchable]="true"
      [(ngModel)]="selectedReligions"
      [disabled]="isLoading"
      >
      </ng-select>
    </div>


  <div class="w-full px-6 md:w-1/2 mb-6">
    <label for="diet" class="mb-1">Community</label>
    <ng-select
    [items]="communityList"
    bindLabel="name"
    bindValue="id"
    [ngModelOptions]="{standalone: true}"
    [clearable]="true"
    [searchable]="true"
    [(ngModel)]="selectedCommunity"

    [disabled]="isLoading"
    >
    </ng-select>
    <div class="form-check mt-1">
      <input class="form-check-input small-check" type="checkbox" [value]="true" id="flexCheckChecked" formControlName="isVisible">
      <label class="form-check-label ml-2 text-sm" for="flexCheckChecked"> Make it visible.</label>
    </div>
  </div>

  <!-- <div class="w-full px-6 md:w-1/2 mb-6">
    <label for="diet" class="mb-1">Sub Community</label>
    <ng-select
    [items]="SubCommunityList"
    bindLabel="name"
    bindValue="id"
    [ngModelOptions]="{standalone: true}"
    [clearable]="true"
    [searchable]="true"
    [(ngModel)]="selectedSubCommunity"
    [disabled]="isLoading"
    [disabled]="!selectedCommunity"

    >
    </ng-select>
  </div> -->

  <div class="w-full px-6 md:w-1/2 mb-6">
    <label for="diet" class="mb-1">Raasi</label>
    <ng-select
    [items]="rasiList"
    bindLabel="name"
    bindValue="id"
    [ngModelOptions]="{standalone: true}"
    [clearable]="selectedRaasi === 0 ? false : true"
    [searchable]="true"
    [(ngModel)]="selectedRaasi"
    (ngModelChange)="changeRasi($event)"
    >
    </ng-select>
  </div>

  <div class="w-full px-6 md:w-1/2 mb-6">
    <label for="diet" class="mb-1">Star/Nakshathra</label>
    <ng-select
    [items]="natshathiraList"
    [disabled]="selectedRaasi === 0 || selectedRaasi === null"
    bindLabel="name"
    bindValue="id"
    [ngModelOptions]="{standalone: true}"
    [clearable]="selectedStar === 0 ? false : true"
    [searchable]="true"
    [(ngModel)]="selectedStar"
    >
    </ng-select>
  </div>

  <div class=" font-bold text-gray-500 mb-6 mt-6">Birth Details</div>
 <div class="w-full px-6 md:w-1/2 mb-6">
  <div class="form-group mb-6">
    <label for="timeOfBirth" class="mb-2">Time of Birth</label>

    <div class="input-group">
      <input type="time" id="timeOfBirth" formControlName="timeOfBirth" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userReligiousForm.get('timeOfBirth')?.errors}" >
      <button *ngIf="userReligiousForm.get('timeOfBirth')?.value" type="button" class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all border" (click)="userReligiousForm.get('timeOfBirth')?.setValue(null)">
        clear
      </button>
    </div>

    <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userReligiousForm.get('timeOfBirth')?.errors">
      Time of birth is required
    </div>
  </div>
</div>

   <input type="text" id="country" formControlName="country" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userReligiousForm.get('country')?.errors}"/>
    <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userReligiousForm.get('country')?.errors">Country is required</div>
  </div>
   <div class="w-full px-6 md:w-1/2 mb-6">
    <label for="province text-sm" class="mb-2">State/Province<span class="text-red-600">*</span> </label>
    <input type="text" id="province" formControlName="stateProvince" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userReligiousForm.get('stateProvince')?.errors}"/>
    <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userReligiousForm.get('stateProvince')?.errors">State/Province is required</div>
     <!-- <ng-select [items]="stateAndProvince" bindLabel="name" bindValue="name" [clearable]="false"
      [searchable]="true" [(ngModel)]="selectedProvince"  [ngModelOptions]="{standalone: true}" ></ng-select> -->
  </div>

  <div class="w-full px-6 md:w-1/2 mb-6">
    <label for="city text-sm" class="mb-2">City/Village<span class="text-red-600">*</span> </label>
    <input type="text" id="city" formControlName="city" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userReligiousForm.get('city')?.errors}"/>
    <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userReligiousForm.get('city')?.errors">City is required</div>
  </div>
<!-- STREET -->
<div class="w-full px-6 md:w-1/2 mb-6">
  <label for="Street text-sm" class="mb-2">Street<span class="text-red-600">*</span> </label>
  <input type="text" id="Street" formControlName="street" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userReligiousForm.get('street')?.errors}"/>
  <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userReligiousForm.get('street')?.errors">Street is required</div>
</div>

        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userReligiousForm.get('zipCode')?.errors">ZipCode is required</div>
      </div> -->

  <button class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium text-white bg-red-600 hover:bg-red-700 shadow-sm transition-all mr-4 w-full mt-8" (click)="next()" [disabled]="isLoading">{{isEditFrom ? 'UPDATE' : 'NEXT'}} <div class="spinner-border spinner-border-sm text-light mr-1" *ngIf="isLoading"></div></button>
</div>
</form>
