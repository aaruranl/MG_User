
<form [formGroup]="userEducationFrom">
  <div class="flex flex-wrap -mx-3">
    <div class="font-bold text-gray-500 mb-6 mt-6">Education</div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Highest Education</label>
      <ng-select
        [items]="educationList"
        bindLabel="name"
        bindValue="id"
        [ngModelOptions]="{standalone: true}"
        [clearable]="true"
        [(ngModel)]="selectedEducation"
        (change)="changeHightEduction()"
      >
      </ng-select>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Qualification<span class="text-red-600" *ngIf="selectedEducation">*</span></label>
      <input type="text" id="qualification" formControlName="qualification" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userEducationFrom.get('qualification')?.errors}">
      <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userEducationFrom.get('qualification')?.errors">Qualification is required</div>
    </div>

    <div class="w-full px-6 md:w-full mb-6">
      <label for="diet" class="mb-1">Institute<span class="text-red-600" *ngIf="selectedEducation">*</span></label>
      <input type="text" id="institute" formControlName="institute" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userEducationFrom.get('institute')?.errors}">
      <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userEducationFrom.get('institute')?.errors">institute is required</div>
    </div>


    <div class="font-bold text-gray-500 mb-6 mt-2">Job</div>


    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Sector</label>
      <ng-select
      [items]="sectorList"
      bindLabel="name"
      bindValue="id"
      [ngModelOptions]="{standalone: true}"
      [clearable]="selectedSector === 0 ? false : true"
      [searchable]="true"
      [(ngModel)]="selectedSector"
      (change)="changeJobSector()"
      >
      </ng-select>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Job Type <span class="text-red-600" *ngIf="selectedSector">*</span></label>
      <ng-select
      [items]="jobTypeList"
      bindLabel="name"
      bindValue="id"
      [ngModelOptions]="{standalone: true}"
      [clearable]="selectedJob === ''? false : true"
      [searchable]="true"
      [ngClass]="{'errorSelect': isSubmitted && selectedJob  === '' && selectedSector !== null && selectedSector }"
      [disabled]="!selectedSector"
      [(ngModel)]="selectedJob"
      >
      </ng-select>
 <div class="text-xs text-red-600 mt-1"
       *ngIf="isSubmitted && selectedJob === '' && selectedSector">
    Job Type is required
  </div>
    </div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Job Title <span class="text-red-600" *ngIf="selectedSector">*</span></label>
      <input type="text" id="jobTitle" formControlName="jobTitle" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userEducationFrom.get('jobTitle')?.errors}">
      <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userEducationFrom.get('jobTitle')?.errors">jobTitle is required</div>
    </div>

    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Company Name <span class="text-red-600" *ngIf="selectedSector">*</span></label>
      <input type="text" id="companyName" formControlName="companyName" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userEducationFrom.get('companyName')?.errors}">
      <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userEducationFrom.get('companyName')?.errors">Company name is required</div>
    </div>


    <div class="font-bold text-gray-500 mb-6 mt-6">Income</div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Salary <span class="text-red-600" *ngIf="selectedSector">*</span></label>
        <input type="number" id="salaryDetails" formControlName="salaryDetails" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all" [ngClass]="{'errorBorder': isSubmitted && userEducationFrom.get('salaryDetails')?.errors}" (change)="changeSalary()">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && userEducationFrom.get('salaryDetails')?.errors">Salary is required</div>
        <div class="form-check mt-1">
          <input class="form-check-input small-check" type="checkbox" [value]="true" id="flexCheckChecked" formControlName="isVisible">
          <label class="form-check-label ml-2 text-sm" for="flexCheckChecked">
            Make it visible.
          </label>
        </div>
    </div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Currency <span class="text-red-600" *ngIf="selectedSector">*</span></label>
      <ng-select
      [items]="currencyList"
      bindLabel="code"
      bindValue="code"
      [ngModelOptions]="{standalone: true}"
      [clearable]="true"
      [searchable]="true"
      [ngClass]="{'errorSelect': isSubmitted && selectedCurrency < 1 && userEducationFrom.get('salaryDetails')!.value !== null}"
      [disabled]="!userEducationFrom.get('salaryDetails')!.value"
      [(ngModel)]="selectedCurrency">
    </ng-select>
    <div class="text-xs text-red-600 mt-1"
       *ngIf="isSubmitted && userEducationFrom.get('salaryDetails')?.value && !selectedCurrency">
    Currency is required
  </div>
    </div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="diet" class="mb-1">Salary Type</label>
      <div class="flex">
        <div class="mr-4">
          <div class="form-check">
            <input class="form-check-input cursor-pointer" type="radio" name="isYearly" id="monthly" [value]="false" formControlName="isYearly">
            <label class="form-check-label ml-2" for="monthly">Monthly</label>
          </div>
        </div>
        <div class="mr-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="isYearly" id="yearly" [value]="true" formControlName="isYearly">
            <label class="form-check-label ml-2 cursor-pointer" for="yearly">Yearly</label>
          </div>
        </div>

      </div>
    </div>

    <button class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium text-white bg-red-600 hover:bg-red-700 shadow-sm transition-all mr-4 w-full mt-8" (click)="next()" [disabled]="isLoading"> <div class="spinner-border spinner-border-sm text-light mr-1" role="status" *ngIf="isLoading"></div>   {{isEditFrom ? 'UPDATE' : 'FINISH'}}</button>
  </div>
</form>
