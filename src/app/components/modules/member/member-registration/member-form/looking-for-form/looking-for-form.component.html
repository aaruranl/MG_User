
<form [formGroup]="profileMatchingForm">
  <div class="flex flex-wrap -mx-3">
    <div class="w-full px-6 md:w-full mb-6">
      <label for="diet" class="mb-1 font-bold text-gray-500">I am creating this Profile for?<span class="text-red-600">*</span></label>
      <ng-select
      [items]="lookingForList"
      bindLabel="name"
      bindValue="id"
      [ngModelOptions]="{standalone: true}"
      [clearable]="false"
      [readonly]="isEditFrom"
      [searchable]="true"
      [(ngModel)]="SelectedLookingFor">

    </ng-select>
    </div>
    <!-- <div class="text-md font-bold text-gray-500 mb-6 mt-6" *ngIf="SelectedLookingFor === 1 || SelectedLookingFor === 6 || SelectedLookingFor === 7">Looking For in a Match</div> -->
    <!-- <div class="w-full px-6 md:w-full mb-6" *ngIf="SelectedLookingFor === 1 || SelectedLookingFor === 6 || SelectedLookingFor === 7">
      <label for="diet" class="mb-1 ">Looking For Gender<span class="text-red-600">*</span></label>
      <div class="flex">
        <div class="mr-4">
          <div class="form-check">
            <input class="form-check-input cursor-pointer" type="radio" name="gender" id="genderMale" [value]="1" formControlName="gender">
            <label class="form-check-label ml-2" for="genderMale">Male</label>
          </div>
        </div>
        <div class="mr-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderFemale" [value]="2" formControlName="gender">
            <label class="form-check-label ml-2 cursor-pointer " for="genderFemale">Female</label>
          </div>
        </div>
      </div>
    </div> -->

    <div class="w-full px-6 md:w-1/4">
      <div class="form-group mb-6">
        <label for="minAge" class="mb-1">Min Age <span class="text-red-600">*</span></label>
        <input type="number" id="minAge" formControlName="minAge" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"  [ngClass]="{'errorBorder': isSubmitted && profileMatchingForm.get('minAge')?.errors}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && profileMatchingForm.get('minAge')?.errors" class="error-message">
          <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && profileMatchingForm.get('minAge')?.errors?.['required']">Min age is required</div>
          <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && profileMatchingForm.get('minAge')?.errors?.['min']">Age must be greater than 18.</div>
        </div>
      </div>
    </div>
    <div class="w-full px-6 md:w-1/4">
      <div class="form-group mb-6">
        <label for="maxAge" class="mb-1">Max Age <span class="text-red-600">*</span></label>
        <input type="number" id="maxAge" formControlName="maxAge" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-[#5c142b] focus:ring-2 focus:ring-[#5c142b]/20 outline-none text-sm bg-white text-gray-800 transition-all"  [ngClass]="{'errorBorder': isSubmitted && (profileMatchingForm.get('maxAge')?.errors || profileMatchingForm.hasError('minGreaterThanMax'))}">
        <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && profileMatchingForm.get('maxAge')?.errors" class="error-message">
          <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && profileMatchingForm.get('maxAge')?.errors?.['required']">Max age is required</div>
          <div class="text-xs text-red-600 mt-1" *ngIf="isSubmitted && profileMatchingForm.get('maxAge')?.errors?.['max']">Age must be lower than 60.</div>
        </div>
      </div>
    </div>
    <div class="w-full px-6 md:w-1/2 mb-6">
      <label for="email text-sm" class="mb-1">Preferred Country<span class="text-red-600">*</span> </label>
      <ng-select [items]="countryList" bindLabel="country" bindValue="country" [ngModelOptions]="{standalone: true}" [clearable]="false"
      [searchable]="false" [(ngModel)]="selectedCountry">
      <!-- Label template -->
      <ng-template ng-label-tmp let-item="item">
        <div class="flex">
          <div>
            <img class="mr-2" src={{item.flags?.svg}} alt="" width="30px">
          </div>
          <div>
            {{item.country}}
          </div>
        </div>
      </ng-template>
      <!-- Option template -->
      <ng-template ng-option-tmp let-item="item" let-search="searchTerm">
        <div class="flex">
          <div>
            <img src={{item.flags?.svg}} alt="" width="30px" class="mr-2">
          </div>

          <div class="">
            {{item.country}}
          </div>
        </div>
      </ng-template>
    </ng-select>
    </div>
    <div class="text-red-600 mb-6" *ngIf="profileMatchingForm.hasError('minGreaterThanMax') && profileMatchingForm.touched">
         Max age must be greater than min age.
      </div>

    <button class="inline-flex items-center justify-center px-4 py-2 rounded-xl text-sm font-medium text-white bg-red-600 hover:bg-red-700 shadow-sm transition-all mr-4 w-full mt-2" [disabled]="isLoading" (click)="next()">  <div class="spinner-border spinner-border-sm text-light mr-1" *ngIf="isLoading"></div>
      {{isEditFrom ? 'UPDATE' : 'NEXT'}}</button>
</div>
</form>
