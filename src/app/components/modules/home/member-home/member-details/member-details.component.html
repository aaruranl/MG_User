<section class="content">
  <div class="component-content mt-6">
    <div
      class="w-11/12 px-6 md:w-10/12 lg:w-2/3 mx-auto bg-white pb-3"
      *ngIf="!isLoading"
    >
      <app-member-profile-modal
        [memberProfile]="filterMemberViewData"
        [isPopUp]="false"
      ></app-member-profile-modal>
    </div>
    <app-loading *ngIf="isLoading"></app-loading>
  </div>
</section>
